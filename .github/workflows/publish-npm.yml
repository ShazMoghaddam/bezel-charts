name: Publish npm package

# Runs when a release tag like v1.2.0 is pushed (Python tags start with py-v,
# so they don't match). npm trusts this workflow directly (trusted publishing),
# so there is no token to store or leak, and every release gets a provenance
# statement linking it to the commit it was built from.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/bezel-charts
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Tag matches the package version
        run: |
          version=$(node -p "require('./package.json').version")
          test "v$version" = "$GITHUB_REF_NAME" || (echo "Tag $GITHUB_REF_NAME does not match version $version" && exit 1)
      - run: npm ci
      - run: npm run check
      - name: Check dist is up to date
        run: git diff --exit-code -- dist || (echo "Run npm run build and commit dist/" && exit 1)
      # Trusted publishing needs npm 11.5.1 or later; Node 22 ships with npm 10.
      - run: npm install -g npm@11
      - run: npm publish
