name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run size
      - name: Check dist is up to date
        run: test -z "$(git status --porcelain -- dist)" || (git status --short -- dist && echo "Run npm run build and commit dist/" && exit 1)
