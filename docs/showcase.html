<!doctype html>
<meta charset="utf-8">
<title>Bezel Charts showcase</title>
<!-- Renders docs/bezel-charts.png, the image at the top of the README:
     npm run serve, then: python3 scripts/shot.py http://localhost:4173/docs/showcase.html docs/bezel-charts.png 1600 -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300..800&family=Geist+Mono:wght@400..600&display=swap">
<style>
  html, body { margin: 0; }
  body { width: 1600px; background: radial-gradient(120% 90% at 50% 0%, #F4F5F7 0%, #DCDFE4 100%); font-family: "Geist", sans-serif; }
  .grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 24px; padding: 48px; align-items: start; }
  .wide { grid-column: span 2; }
  .full { grid-column: 1 / -1; }
  .stack { display: grid; gap: 24px; }
</style>
<script type="module" src="../src/index.js"></script>
