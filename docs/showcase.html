<!doctype html>
<meta charset="utf-8">
<title>Bezel Charts showcase</title>
<!-- Renders docs/bezel-charts.png, the image at the top of the README:
     npm run serve, then: python3 scripts/shot.py http://localhost:4173/docs/showcase.html docs/bezel-charts.png 1200 -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300..800&family=Geist+Mono:wght@400..600&display=swap">
<style>
  html, body { margin: 0; }
  body { width: 1200px; background: radial-gradient(120% 90% at 50% 0%, #F4F5F7 0%, #DCDFE4 100%); font-family: "Geist", sans-serif; }
  .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px; padding: 48px; align-items: start; }
  .wide { grid-column: span 2; }
  .full { grid-column: 1 / -1; }
</style>
<script type="module" src="../src/index.js"></script>

<div class="grid">
  <bezel-spark static theme="dark" heading="London · 7 day high" values="17,16,15,15,13,12,14" labels="Mon,Tue,Wed,Thu,Fri,Sat,Sun" suffix="°C" delta-label="since Monday"></bezel-spark>
  <bezel-ring static theme="light" heading="Today" values="72,45,90" labels="Move,Focus,Sleep"></bezel-ring>
  <bezel-gauge static theme="dark" heading="Server load" values="63" labels="CPU" zones="60,85" goal="80"></bezel-gauge>

  <bezel-line static theme="light" class="wide" heading="Site visitors" values="420,460,510,580,620,900,1180,1240,1310,1290,1420,1560|380,400,430,450,470,490,520,540,560,600,610,640" series="2026,2025" labels="Jan,Feb,Mar,Apr,May,Jun,Jul,Aug,Sep,Oct,Nov,Dec" notes="Jun:Launch day" compact></bezel-line>
  <bezel-donut static theme="dark" heading="Monthly budget" values="1200,420,210,160,140" labels="Rent,Food,Bills,Travel,Fun" prefix="£"></bezel-donut>

  <bezel-bars static theme="dark" heading="Commits this week" values="4,9,6,3,8,5,3" labels="M,T,W,T,F,S,S" stat="total" show-values goal="7" goal-label="Target"></bezel-bars>
